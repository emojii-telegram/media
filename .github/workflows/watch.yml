# Hourly: new posts in t.me/durov and t.me/telegram → reply drafts for X in the owner's Telegram.
name: watch-durov
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: agent-state, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - run: node agent/watch.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      - name: save state
        run: |
          git config user.name "emojii-agent"; git config user.email "agent@users.noreply.github.com"
          git add state && git commit -m "watch state" && git pull --rebase && git push || echo "no state change"
